global:
  # Standard five-field cron expression, interpreted in schedule_timezone.
  scrape_schedule: "0 * * * *"
  schedule_timezone: UTC
  locations: [europe-west1]
  temporal:
    address: localhost:7233
    namespace: default
    task_queue: gcp-metrics-exporter
  # Enable the billing resource below to query this standard BigQuery billing
  # export. query_project must have BigQuery Jobs permission and access to table.
  billing:
    query_project: billing-project
    table: billing-project.billing_dataset.gcp_billing_export_v1_ABCDEF_123456
    # false emits one total per project and invoice month; true emits one per service.
    group_by_service: false

storage:
  elasticsearch:
    addresses: [http://localhost:9200]
    index_prefix: gcp-inventory

resources:
  - billing
  - cloud_run_service
  - cloud_run_revision
  - cloud_run_worker_pool

projects:
  - name: production
    id: example-production-project
    # locations, resources, and scrape_schedule inherit from global when omitted.
