services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
      POSTGRES_DB: temporal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: [postgres-data:/var/lib/postgresql/data]

  temporal:
    image: temporalio/auto-setup:1.26.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
    ports: ["7233:7233"]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["9200:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes: [elasticsearch-data:/usr/share/elasticsearch/data]

  elasticsearch-template:
    image: curlimages/curl:8.12.1
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./elasticsearch-index-template.json:/template.json:ro
    command: ["-fsS", "-X", "PUT", "http://elasticsearch:9200/_index_template/gcp-metrics-exporter", "-H", "Content-Type: application/json", "--data-binary", "@/template.json"]

  exporter:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      temporal:
        condition: service_started
      elasticsearch-template:
        condition: service_completed_successfully
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /gcp/adc.json
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ${GCME_ADC_FILE:?Set GCME_ADC_FILE to your Application Default Credentials JSON}:/gcp/adc.json:ro

volumes:
  postgres-data:
  elasticsearch-data:
