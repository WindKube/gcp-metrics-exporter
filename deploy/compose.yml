services:
  exporter:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      GCME_PRODUCTION_CREDENTIALS: ${GCME_PRODUCTION_CREDENTIALS:?Set GCME_PRODUCTION_CREDENTIALS to base64-encoded credential JSON}
    networks: [gcp-metrics-exporter]
    volumes:
      - ./config.yaml:/app/config.yaml:ro

networks:
  gcp-metrics-exporter:
    name: gcp-metrics-exporter
